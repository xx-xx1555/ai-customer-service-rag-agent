services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_agent_password}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent -d ai_agent"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ai-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-18000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_agent}:${POSTGRES_PASSWORD:-ai_agent_password}@postgres:5432/${POSTGRES_DB:-ai_agent}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_DEVICE: cpu
      RERANKER_DEVICE: cpu
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    environment:
      API_BASE_URL: http://ai-agent-api:8000
      API_TIMEOUT: 300
    depends_on:
      - ai-agent-api
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  huggingface_cache:
